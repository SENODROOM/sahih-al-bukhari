name: Publish Ruby Gem to RubyGems.org

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (build + test only, no publish)'
        required: false
        default: 'false'

jobs:
  publish-gem:
    name: Build, Test & Publish
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ruby

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Ruby setup ────────────────────────────────────────────────────────
      # FIX: removed bundler-cache: true — it requires a committed Gemfile.lock
      # to resolve gems. Without it bundler errors with GemNotFound for every dep.
      # We run bundle install explicitly in the next step instead.
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'

      # ── 3. Copy shared data file into ruby/data/ ─────────────────────────────
      # The gemspec includes data/bukhari.json.gz in spec.files.
      # The canonical copy lives at the repo root: data/bukhari.json.gz
      - name: Copy bundled data into ruby/data/
        run: |
          mkdir -p data
          cp ../data/bukhari.json.gz data/bukhari.json.gz

      # ── 4. Install dependencies ───────────────────────────────────────────────
      # FIX: must install gems before running rake. Without bundler-cache this
      # step is required. --jobs 4 speeds it up; --retry 3 handles flaky network.
      - name: Install dependencies
        run: bundle install --jobs 4 --retry 3

      # ── 5. Run tests ─────────────────────────────────────────────────────────
      - name: Run tests
        run: bundle exec rake test

      # ── 6. Build gem ─────────────────────────────────────────────────────────
      - name: Build gem
        run: gem build sahih_al_bukhari.gemspec

      # ── 7. Publish (skipped on dry run) ──────────────────────────────────────
      - name: Publish to RubyGems.org
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          mkdir -p ~/.gem
          cat > ~/.gem/credentials << EOF
          ---
          :rubygems_api_key: ${{ secrets.RUBYGEMS_API_KEY }}
          EOF
          chmod 0600 ~/.gem/credentials
          gem push sahih-al-bukhari-*.gem

      # ── 8. Upload .gem as release asset ──────────────────────────────────────
      - name: Upload .gem to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: ruby/sahih-al-bukhari-*.gem