name: Publish Ruby Gem to RubyGems.org

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (build + test only, no publish)'
        required: false
        default: 'false'

jobs:
  publish-gem:
    name: Build, Test & Publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'

      - name: Copy bundled data into ruby/data/
        run: |
          mkdir -p ruby/data
          cp data/bukhari.json.gz ruby/data/bukhari.json.gz

      - name: Install gems
        run: gem install rake test-unit rspec rubocop yard --no-document

      - name: Run tests
        working-directory: ruby
        run: rake test

      - name: Build gem
        working-directory: ruby
        run: |
          # Read version directly from version.rb
          VERSION=$(ruby -e "require_relative 'lib/sahih_al_bukhari/version'; puts SahihAlBukhari::VERSION")
          GEM_FILE="sahih-al-bukhari-${VERSION}.gem"
          echo "Building version: $VERSION"
          # Remove this exact file if it exists from a previous run
          rm -f "$GEM_FILE"
          gem build sahih_al_bukhari.gemspec
          echo "GEM_FILE=$GEM_FILE" >> $GITHUB_ENV
          echo "Built: $GEM_FILE"

      - name: Publish to RubyGems.org
        if: ${{ github.event.inputs.dry_run != 'true' }}
        working-directory: ruby
        run: |
          mkdir -p ~/.gem
          cat > ~/.gem/credentials << EOF
          ---
          :rubygems_api_key: ${{ secrets.RUBYGEMS_API_KEY }}
          EOF
          chmod 0600 ~/.gem/credentials
          echo "Pushing: $GEM_FILE"
          gem push "$GEM_FILE"

      - name: Upload .gem to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: ruby/${{ env.GEM_FILE }}