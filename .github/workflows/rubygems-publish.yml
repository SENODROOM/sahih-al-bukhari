name: Publish Ruby Gem to RubyGems.org

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (build + test only, no publish)'
        required: false
        default: 'false'

jobs:
  publish-gem:
    name: Build, Test & Publish
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Ruby setup — no bundler-cache, no working-directory tricks ─────────
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'

      # ── 3. Copy shared data file into ruby/data/ ─────────────────────────────
      - name: Copy bundled data into ruby/data/
        run: |
          mkdir -p ruby/data
          cp data/bukhari.json.gz ruby/data/bukhari.json.gz

      # ── 4. Install gems directly — no bundler involved ───────────────────────
      # Bypasses all Bundler path/lockfile issues by installing gems globally.
      - name: Install gems
        run: gem install rake test-unit rspec rubocop yard --no-document

      # ── 5. Run tests with plain ruby/rake (no bundle exec) ───────────────────
      - name: Run tests
        working-directory: ruby
        run: rake test

      # ── 6. Build gem ─────────────────────────────────────────────────────────
      - name: Build gem
        working-directory: ruby
        run: gem build sahih_al_bukhari.gemspec

      # ── 7. Publish (skipped on dry run) ──────────────────────────────────────
      - name: Publish to RubyGems.org
        if: ${{ github.event.inputs.dry_run != 'true' }}
        working-directory: ruby
        run: |
          mkdir -p ~/.gem
          cat > ~/.gem/credentials << EOF
          ---
          :rubygems_api_key: ${{ secrets.RUBYGEMS_API_KEY }}
          EOF
          chmod 0600 ~/.gem/credentials
          gem push sahih-al-bukhari-*.gem

      # ── 8. Upload .gem as release asset ──────────────────────────────────────
      - name: Upload .gem to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: ruby/sahih-al-bukhari-*.gem